<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상가 견적서 | 하이탑부동산</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* Premium navy and champagne gold theme */

    :root {
      --navy: #172A52;
      --navy-deep: #0F1D3A;
      --navy-mid: #243F77;
      --navy-light: #E9EEF7;
      --navy-lite: #E9EEF7;
      --navy-bg: #F1F4F9;
      --gold: #C8A96B;
      --gold-deep: #A98545;
      --gold-light: #EFE4CB;
      --accent: #C8A96B;
      --red: #B94A48;
      --red-accent: #B4232C;
      --red-deep: #8F1D24;
      --red-light: #FCEBEC;
      --red-lite: #F8ECE9;
      --background: #F3F5F9;
      --card: #FFFFFF;
      --border: #D9DFE9;
      --text: #26354D;
      --text-muted: #778397;
      --text-mid: #4C5B73;
      --bg: #F3F5F9;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      font-size: 15px;
    }

    .site-header {
      background: var(--navy-deep);
      color: white;
      padding: 17px 40px;
      border-bottom: 3px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .site-header .h-left h1 { font-size: 25px; font-weight: 800; letter-spacing: 2.2px; color: #fff; line-height: 1.2; }
    .site-header .h-left p  { color: rgba(239,228,203,0.78); font-size: 11.5px; letter-spacing: 2.3px; margin-top: 4px; }
    .site-header .h-right   { text-align: right; line-height: 1.45; flex-shrink: 0; }
    .site-header .h-right strong { display: block; color: rgba(255,255,255,0.96); font-size: 15px; font-weight: 700; letter-spacing: 0.8px; }
    .site-header .h-right span  { color: rgba(239,228,203,0.78); font-size: 13px; }
    .page-nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 40px;
      display: flex;
      justify-content: center;
    }
    .page-nav a {
      background: var(--navy);
      color: white;
      text-decoration: none;
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.35px;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 6px 18px rgba(15,29,58,0.08);
    }
    .page-nav a:hover {
      background: var(--navy-deep);
      color: var(--gold-light);
      border-color: var(--gold);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15,29,58,0.14);
    }

    .container { max-width: 940px; margin: 0 auto; padding: 26px 24px 48px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(15,29,58,0.08);
      overflow: hidden;
    }
    .input-card { border-top: 3px solid var(--gold); margin-bottom: 22px; }
    .input-card-head { padding: 19px 28px 0; display: flex; align-items: center; gap: 10px; }
    .input-card-head h2 { font-size: 17px; font-weight: 800; color: var(--navy-deep); }
    .badge { background: var(--gold-light); color: var(--navy-deep); border: 1px solid var(--gold); font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.5px; }
    .input-body { padding: 16px 28px 26px; }
    .input-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px 18px; }
    .ig { display: flex; flex-direction: column; gap: 6px; }
    .ig label { font-size: 12.5px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.25px; text-transform: uppercase; }
    .iw { position: relative; }
    .iw input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 11px 38px 11px 13px; font-size: 15.5px;
      font-family: 'Noto Sans KR', sans-serif; color: var(--navy-deep);
      background: #F8F9FC; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .iw input::placeholder { color: #8B96A8; }
    .iw input:focus { border-color: var(--gold); background: white; box-shadow: 0 0 0 3px rgba(200,169,107,0.16); }
    .iw .unit { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-muted); font-weight: 700; pointer-events: none; }
    .btn-row { grid-column: 1 / -1; margin-top: 6px; }
    .btn-calc {
      width: 100%;
      background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy-mid) 100%);
      color: white; border: 1px solid rgba(200,169,107,0.55); border-radius: 9px; padding: 15px;
      font-size: 18px; font-weight: 800; font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; letter-spacing: 2.5px;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s, border-color 0.15s;
    }
    .btn-calc:hover { opacity: 0.96; transform: translateY(-1px); border-color: var(--gold); box-shadow: 0 9px 24px rgba(15,29,58,0.24); }
    .btn-calc:active { transform: translateY(0); box-shadow: none; }
    .input-sec-lbl {
      grid-column: 1 / -1;
      font-size: 12px; font-weight: 800; color: var(--navy-mid);
      letter-spacing: 2.3px;
      padding: 10px 0 7px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }
    .amt-hint {
      font-size: 12px;
      font-weight: 800;
      color: var(--red-accent);
      margin-top: 3px;
      min-height: 17px;
      letter-spacing: 0.2px;
      transition: opacity 0.2s;
    }
    .amt-hint:empty { min-height: 0; }

    .calc-display {
      background: var(--navy-light); border: 1.5px solid rgba(200,169,107,0.45);
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 14.5px; font-weight: 800; color: var(--navy-deep);
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .radio-group { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 6px 0; }
    .radio-group label {
      display: flex; align-items: center; gap: 5px;
      font-size: 14px; font-weight: 600; color: var(--navy-deep);
      cursor: pointer; white-space: nowrap;
    }
    .radio-group input[type=radio] { accent-color: var(--navy); cursor: pointer; }

    .mid-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 18px;
    }

    .out-bar {
      display: flex; align-items: center;
      padding: 13px 20px;
      border-bottom: 1px solid rgba(200,169,107,0.42);
      background: #F1F4F9;
    }
    .out-bar-title { font-size: 15.5px; font-weight: 800; color: var(--navy-deep); }
    .out-bar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .print-tip { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .print-tip strong { color: var(--navy-mid); font-weight: 700; }
    .btn-print {
      background: var(--navy); color: white; border: 1px solid rgba(200,169,107,0.65);
      border-radius: 7px; padding: 8px 17px; font-size: 13.5px; font-weight: 800;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      letter-spacing: 0.35px; transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.2s, transform 0.1s;
    }
    .btn-print:hover { background: var(--navy-deep); color: var(--gold-light); border-color: var(--gold); box-shadow: 0 8px 20px rgba(15,29,58,0.16); transform: translateY(-1px); }

    .est-pane { padding: 28px; }

    .ph { text-align: center; padding: 60px 20px; }
    .ph-icon {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--navy-lite);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
    }
    .ph p { font-size: 14px; color: #a0aec0; font-weight: 500; }
    .ph strong { color: var(--navy-mid); }
    .est-doc { max-width: 700px; margin: 0 auto; border: 1px solid var(--border); font-size: 14.5px; background: white; display: flex; flex-direction: column; }
    .est-banner {
      background: linear-gradient(155deg, var(--navy-deep) 0%, var(--navy-mid) 100%); color: white;
      text-align: center; padding: 22px 24px 27px; position: relative;
    }
    .est-banner::after {
      content: ''; display: block; height: 3px;
      background: var(--gold);
      position: absolute; bottom: 0; left: 0; right: 0;
    }
    .est-banner-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; text-align: left;
    }
    .est-brand { display: flex; align-items: center; gap: 8px; }
    .est-brand .kr { display: block; font-size: 13px; font-weight: 900; letter-spacing: 1px; color: #fff; }
    .est-brand .en { display: block; font-size: 8px; font-weight: 500; letter-spacing: 2px; color: rgba(239,228,203,0.75); text-transform: uppercase; margin-top: 1px; }
    .est-date { font-size: 10.5px; letter-spacing: 0.5px; color: rgba(239,228,203,0.85); border: 1px solid rgba(239,228,203,0.4); padding: 5px 11px; white-space: nowrap; }
    .est-date b { color: #fff; margin-left: 3px; }
    .est-banner h2 { font-size: 22px; font-weight: 800; letter-spacing: 4.5px; }
    .est-banner .sub { color: rgba(239,228,203,0.78); font-size: 11px; letter-spacing: 3px; margin-top: 6px; font-weight: 500; }
    .info-card {
      background: #F5F3EA; border-left: 4px solid var(--gold);
      margin: -8px 20px 0; padding: 14px 18px; position: relative; z-index: 1;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 14px;
      box-shadow: 0 6px 16px rgba(15,29,58,0.10);
    }
    .info-card .info-cell .i-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.6px; margin-bottom: 3px; }
    .info-card .info-cell .i-value { font-size: 13px; font-weight: 700; color: var(--navy-deep); }
    .est-tbl { width: 100%; border-collapse: collapse; }
    .est-tbl th, .est-tbl td { border: 1px solid var(--border); padding: 10px 14px; font-size: 14.5px; }
    .est-tbl thead th {
      background: var(--navy-deep); color: white;
      font-size: 12.5px; font-weight: 700;
      text-align: center; letter-spacing: 0.8px; border-color: var(--navy-mid);
    }
    .est-tbl .lbl { background: #F4F6FA; font-weight: 700; color: var(--text-mid); width: 30%; }
    .est-tbl .c-both { text-align: center; color: var(--text); }
    .est-tbl .c-loan { text-align: right; color: var(--navy-mid); font-weight: 700; }
    .est-tbl .c-no   { text-align: right; color: var(--navy); font-weight: 700; }
    .est-tbl .c-cost { text-align: right; color: var(--red-accent); font-weight: 800; }
    .est-tbl .c-loan.neg, .est-tbl .c-no.neg { color: var(--red-accent); }
    .est-tbl .dash   { text-align: center; color: #B7C0CF; }
    .est-tbl .sec td {
      background: var(--navy); color: white;
      font-size: 12px; font-weight: 800;
      letter-spacing: 3px; padding: 8px 16px; border-color: var(--navy-mid);
    }
    .est-tbl .alt td { background: #FBFCFE; }
    .est-tbl .emph-row .lbl { background: var(--navy-light); border-left: 3px solid var(--gold); color: var(--navy-deep); }
    .est-tbl .emph-row .emph-num { background: var(--navy-light); font-size: 17px; font-weight: 800; color: var(--red-accent); letter-spacing: 0; }
    .est-tbl .inv td { background: var(--navy-bg); }
    .est-tbl .yld td   { padding: 14px 14px; background: linear-gradient(90deg, var(--navy-deep), var(--navy-mid)); border-color: var(--navy-mid); }
    .est-tbl .yld .lbl { font-size: 16px; font-weight: 800; background: transparent; border-left: 3px solid var(--gold); color: var(--gold-light); }

    .yc { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
    .ynum { font-size: 25px; font-weight: 800; line-height: 1; min-width: 76px; text-align: right; }
    .ynum.loan-o { color: #FF9D8F; }
    .ynum.loan-x { color: #8FD3A0; }
    .ytrack { width: 90px; height: 9px; background: rgba(255,255,255,0.18); border-radius: 5px; overflow: hidden; flex-shrink: 0; }
    .yfill { height: 100%; border-radius: 5px; transition: width 0.85s cubic-bezier(0.22, 1, 0.36, 1); }
    .yfill.r1 { background: linear-gradient(90deg, #FF9D8F, var(--red-accent)); }
    .yfill.r2 { background: linear-gradient(90deg, var(--gold), #8FD3A0); }

    .est-foot {
      margin-top: auto;
      border: 1px solid var(--border); border-top: 3px solid var(--gold); background: #F8F6EE;
      padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
    }
    .ef-left { display: flex; align-items: center; gap: 10px; }
    .est-foot .fc { color: var(--navy-deep); font-size: 15.5px; font-weight: 900; letter-spacing: 1px; }
    .est-foot .fp { color: #7a8aab; font-size: 10.5px; margin-top: 4px; letter-spacing: 0.3px; line-height: 1.75; }
    .ef-right { text-align: right; flex-shrink: 0; }
    .ef-right .ef-tel { color: var(--navy-deep); font-size: 19px; font-weight: 900; letter-spacing: 0.3px; }
    .ef-right .ef-tel span { color: var(--gold-deep); font-size: 11px; font-weight: 800; margin-right: 5px; }
    .ef-right .ef-fax { color: var(--text-muted); font-size: 10.5px; margin-top: 2px; }
    .est-base { height: 5mm; background: var(--navy-deep); }

    .ref-note {
      border-left: 4px solid var(--accent);
      background: #eef4ff;
      padding: 10px 16px;
      font-size: 12.5px;
      color: var(--text-mid);
      margin: 0;
      line-height: 1.7;
    }
    .ref-note strong { color: var(--navy); font-weight: 700; }

    .area-dual { display: grid; grid-template-columns: 3fr 2fr; gap: 6px; }
    .area-dual .iw input { padding: 9px 30px 9px 10px; }

    @media (max-width: 640px) {
      .site-header { padding: 15px 18px; gap: 12px; align-items: center; }
      .site-header .h-left h1 { font-size: 21px; letter-spacing: 1px; }
      .site-header .h-left p { font-size: 10px; letter-spacing: 1.4px; }
      .site-header .h-right strong { font-size: 13px; }
      .site-header .h-right span { font-size: 12px; }
      .page-nav { padding: 9px 16px; }
      .page-nav a { width: 100%; text-align: center; padding: 10px 14px; font-size: 14px; white-space: nowrap; }
      .container { padding: 20px 14px 38px; }
      .input-card-head { padding: 16px 18px 0; }
      .input-card-head h2 { font-size: 16px; }
      .badge { font-size: 10.5px; }
      .input-body { padding: 14px 18px 22px; }
      .input-grid { grid-template-columns: 1fr; gap: 12px; }
      .ig, .ig[style] { grid-column: auto !important; }
      .ig label { font-size: 11.5px; }
      .iw input { font-size: 14.5px; padding: 10px 36px 10px 12px; }
      .iw .unit { font-size: 11.5px; }
      .btn-calc { font-size: 16px; padding: 14px; letter-spacing: 2px; }
      .out-bar { padding: 12px 14px; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
      .out-bar-title { font-size: 15px; }
      .out-bar-actions { width: 100%; justify-content: space-between; gap: 8px; }
      .print-tip { font-size: 12px; }
      .btn-print { font-size: 13px; padding: 8px 14px; white-space: nowrap; }
      .est-pane { padding: 18px 12px; overflow-x: auto; }
      .est-doc { font-size: 13.5px; }
      .est-banner { padding: 25px 14px 22px; }
      .est-banner h2 { font-size: 18px; letter-spacing: 2.4px; }
      .est-banner .sub { font-size: 9.5px; letter-spacing: 1.8px; }
      .est-tbl th, .est-tbl td { padding: 8px 9px; font-size: 12.5px; }
      .est-tbl .emph-row .emph-num { font-size: 15px; }
      .est-tbl .yld .lbl { font-size: 14px; }
      .ynum { font-size: 20px; min-width: 58px; }
      .ytrack { width: 54px; }
      .area-dual { grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); }
      .radio-group { gap: 10px; }
    }

    /* ===== PRINT ===== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm 10mm 10mm;
      }

      .site-header,
      .input-card,
      .out-bar,
      .no-print,
      .amt-hint { display: none !important; }

      html, body {
        width: 100%;
        height: auto;
        margin: 0;
        padding: 0;
        background: #fff !important;
        color: #111;
        font-size: 100%;
      }
      body { display: block; }
      .container {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
      }
      .card {
        width: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        overflow: visible;
      }
      .est-pane {
        width: 100%;
        padding: 0;
        overflow: visible;
      }
      .est-doc {
        width: 190mm;
        min-height: 277mm;
        max-width: none;
        margin: 0 auto;
        border: 1px solid #222;
        font-size: 9.8pt;
        background: #fff;
        display: flex;
        flex-direction: column;
      }

      .est-banner { padding: 6mm 8mm 6mm; }
      .est-banner-top { margin-bottom: 5mm; }
      .est-brand .kr { font-size: 9.5pt; }
      .est-brand .en { font-size: 6pt; }
      .est-date { font-size: 7.5pt; padding: 1.2mm 2.6mm; }
      .est-banner h2 { font-size: 17pt; letter-spacing: 3.2pt; line-height: 1.15; }
      .est-banner .sub { font-size: 8pt; letter-spacing: 1.8pt; margin-top: 3mm; }

      .info-card { margin: -5mm 6mm 0; padding: 3.5mm 5mm; gap: 2.5mm 3.5mm; }
      .info-card .info-cell .i-label { font-size: 6.8pt; }
      .info-card .info-cell .i-value { font-size: 9.2pt; }

      .est-tbl { width: 100%; page-break-inside: avoid; border-collapse: collapse; margin-top: 5mm; }
      .est-tbl th,
      .est-tbl td { padding: 2.1mm 3.2mm; font-size: 9.5pt; line-height: 1.32; border: 1px solid #9aa3b2; }
      .est-tbl thead th { font-size: 9.5pt; font-weight: 700; }
      .est-tbl .sec td  { padding: 1.7mm 3.2mm; font-size: 9pt; letter-spacing: 1.7pt; }
      .est-tbl .lbl { width: 28%; }
      .est-tbl colgroup col:nth-child(1) { width: 28%; }
      .est-tbl colgroup col:nth-child(2) { width: 36%; }
      .est-tbl colgroup col:nth-child(3) { width: 36%; }
      .est-tbl .c-loan,
      .est-tbl .c-no,
      .est-tbl .c-cost,
      .est-tbl .c-both { text-align: right; }
      .est-tbl .dash { text-align: center; }
      .est-tbl .emph-row .emph-num { font-size: 11pt; font-weight: 800; }
      .est-tbl .yld td { padding: 2.4mm 3.2mm; }
      .est-tbl .yld .lbl { font-size: 10.5pt; }

      .yc { gap: 2.5mm; }
      .ytrack { width: 20mm; height: 2mm; }
      .ynum { font-size: 14pt; min-width: 16mm; }

      .ref-note {
        padding: 2mm 3.2mm;
        font-size: 8.5pt;
        line-height: 1.45;
      }
      .est-foot {
        margin-top: auto;
        padding: 4mm 6mm;
        border-top: 2px solid var(--gold);
        page-break-inside: avoid;
      }
      .est-foot .fc { font-size: 11pt; font-weight: 900; }
      .est-foot .fp { font-size: 7.6pt; line-height: 1.5; margin-top: 1mm; }
      .ef-right .ef-tel { font-size: 14pt; }
      .ef-right .ef-fax { font-size: 8pt; }
      .est-base { height: 4mm; }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

<!-- ===== SITE HEADER ===== -->
<header class="site-header">
  <div class="h-left">
    <h1 id="header-title">수익률 상가 매매 견적서</h1>
    <p id="header-sub">COMMERCIAL REAL ESTATE YIELD ESTIMATE</p>
  </div>
  <div class="h-right">
    <strong>하이탑부동산</strong>
    <span>T. 031.949.8969</span>
  </div>
</header>

<nav class="page-nav no-print">
  <a href="./presale-estimate.html">상가 분양견적서 바로가기</a>
</nav>

<div class="container">

  <!-- ══════════════════════════════════════
       상가매매견적서
  ══════════════════════════════════════ -->
  <div id="mode-sale">

    <!-- INPUT CARD -->
    <div class="card input-card no-print">
      <div class="input-card-head">
        <h2>매물 정보 입력</h2>
        <span class="badge">INPUT</span>
      </div>
      <div class="input-body">
        <div class="input-grid">

          <div class="ig">
            <label>업종</label>
            <div class="iw"><input type="text" id="i-biz" placeholder="예: 카페, 음식점"></div>
          </div>
          <div class="ig">
            <label>층수</label>
            <div class="iw">
              <input type="number" id="i-floor" placeholder="0" min="0" step="1">
              <span class="unit">층</span>
            </div>
          </div>
          <div class="ig" style="grid-column: span 2;">
            <label>매매가격</label>
            <div class="iw">
              <input type="text" id="i-price" placeholder="0" autocomplete="off">
              <span class="unit">원</span>
            </div>
            <div class="amt-hint" id="h-i-price"></div>
          </div>
          <!-- 공급면적 / 전용면적 듀얼 행 -->
          <div class="ig" style="grid-column: span 2;">
            <label>공급면적 (m²)</label>
            <div class="area-dual">
              <div class="iw">
                <input type="number" id="i-supply-m2" placeholder="0" min="0" step="0.01">
                <span class="unit">m²</span>
              </div>
              <div class="iw">
                <input type="number" id="i-supply-py" placeholder="0" min="0" step="0.01">
                <span class="unit">평</span>
              </div>
            </div>
          </div>
          <div class="ig" style="grid-column: span 2;">
            <label>전용면적 (m²)</label>
            <div class="area-dual">
              <div class="iw">
                <input type="number" id="i-priv-m2" placeholder="0" min="0" step="0.01">
                <span class="unit">m²</span>
              </div>
              <div class="iw">
                <input type="number" id="i-priv-py" placeholder="0" min="0" step="0.01">
                <span class="unit">평</span>
              </div>
            </div>
          </div>

          <div class="ig">
            <label>대출비율</label>
            <div class="iw">
              <input type="number" id="i-lratio" value="50" min="0" max="100" step="0.1">
              <span class="unit">%</span>
            </div>
          </div>
          <div class="ig">
            <label>이율</label>
            <div class="iw">
              <input type="number" id="i-rate" value="4.5" min="0" max="30" step="0.1">
              <span class="unit">%</span>
            </div>
          </div>
          <div class="ig">
            <label>보증금</label>
            <div class="iw">
              <input type="text" id="i-deposit" placeholder="0" autocomplete="off">
              <span class="unit">원</span>
            </div>
            <div class="amt-hint" id="h-i-deposit"></div>
          </div>
          <div class="ig">
            <label>월임대료</label>
            <div class="iw">
              <input type="text" id="i-rent" placeholder="0" autocomplete="off">
              <span class="unit">원</span>
            </div>
            <div class="amt-hint" id="h-i-rent"></div>
          </div>

          <div class="btn-row">
            <button class="btn-calc" onclick="calculateSale()">계 산 하 기</button>
          </div>

        </div>
      </div>
    </div>

    <!-- OUTPUT CARD -->
    <div class="card">
      <div class="out-bar no-print">
        <span class="out-bar-title">견 적 서</span>
        <div class="out-bar-actions">
          <span class="print-tip">💡 Chrome 인쇄 → <strong>머리글/바닥글 해제</strong> 권장</span>
          <button class="btn-print" onclick="window.print()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
            인쇄하기
          </button>
        </div>
      </div>

      <div class="est-pane">
        <div id="ph-sale" class="ph">
          <div class="ph-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#90b8f8" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </div>
          <p>매물 정보를 입력하고 <strong>계산하기</strong>를 눌러주세요</p>
        </div>
        <div id="res-sale" style="display:none;"></div>
      </div>
    </div>

  </div><!-- /mode-sale -->

</div><!-- /container -->

<script>
'use strict';

/* ===========================
   공통 유틸
=========================== */
const $    = id => document.getElementById(id);
const fmt  = n => (isNaN(n) || n === null) ? '-' : Math.round(n).toLocaleString('ko-KR');
const fmtD = n => (isNaN(n) || n === null) ? '-' : n.toFixed(2);
const rawN = id => parseFloat($(id).value.replace(/,/g, '')) || 0;

/* ===========================
   한국어 금액 변환 (억/만 단위)
=========================== */
function toKorAmt(n) {
  if (!n || isNaN(n) || n <= 0) return '';
  const uk  = Math.floor(n / 100000000);       // 억
  const man = Math.floor((n % 100000000) / 10000); // 만
  const rem = Math.floor(n % 10000);            // 원 단위

  let parts = [];
  if (uk  > 0) parts.push(uk.toLocaleString('ko-KR') + '억');
  if (man > 0) parts.push(man.toLocaleString('ko-KR') + '만');
  if (rem > 0 && uk === 0) parts.push(rem.toLocaleString('ko-KR'));
  return parts.join(' ') + ' 원';
}

/* ===========================
   힌트 업데이트
=========================== */
function updateHint(inputId, hintId) {
  const val = parseFloat($(inputId).value.replace(/,/g, '')) || 0;
  const hint = $(hintId);
  if (hint) hint.textContent = toKorAmt(val);
}

/* ===========================
   금액 자동 콤마 - 매매
=========================== */
['i-price', 'i-deposit', 'i-rent'].forEach(id => {
  $(id).addEventListener('input', function () {
    const v = this.value.replace(/\D/g, '');
    this.value = v ? Number(v).toLocaleString('ko-KR') : '';
    updateHint(id, 'h-' + id);
  });
});


/* ===========================
   m²↔평 자동 변환 (1평 = 3.30579 m²)
=========================== */
const PY = 3.30579;

function bindAreaSync(m2Id, pyId) {
  const m2El = $(m2Id), pyEl = $(pyId);
  if (!m2El || !pyEl) return;
  m2El.addEventListener('input', () => {
    const v = parseFloat(m2El.value);
    pyEl.value = isNaN(v) || v === 0 ? '' : (v / PY).toFixed(2);
  });
  pyEl.addEventListener('input', () => {
    const v = parseFloat(pyEl.value);
    m2El.value = isNaN(v) || v === 0 ? '' : (v * PY).toFixed(2);
  });
}

bindAreaSync('i-supply-m2', 'i-supply-py');
bindAreaSync('i-priv-m2',   'i-priv-py');

/* ===========================
   Enter 키
=========================== */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') calculateSale();
});


/* ══════════════════════════════════════════
   상가매매견적서 계산
══════════════════════════════════════════ */
function calculateSale() {
  const biz      = $('i-biz').value.trim() || '-';
  const floor    = parseFloat($('i-floor').value) || 0;
  const supplyM2 = parseFloat($('i-supply-m2').value) || 0;
  const supplyPy = parseFloat($('i-supply-py').value) || 0;
  const privM2   = parseFloat($('i-priv-m2').value)   || 0;
  const privPy   = parseFloat($('i-priv-py').value)   || 0;
  const price    = rawN('i-price');
  const lratio   = parseFloat($('i-lratio').value) || 0;
  const rate     = parseFloat($('i-rate').value)   || 0;
  const dep      = rawN('i-deposit');
  const rent     = rawN('i-rent');

  const acqtax = price * 0.046;
  const loan   = price * lratio / 100;
  const intA   = loan * rate / 100;
  const intM   = intA / 12;
  const invL   = price - loan - dep;
  const invN   = price - dep;
  const pmL    = rent - intM;
  const pmN    = rent;
  const paL    = pmL * 12;
  const paN    = pmN * 12;
  const yL     = invL > 0 ? paL / invL * 100 : 0;
  const yN     = invN > 0 ? paN / invN * 100 : 0;

  renderSale({ biz, floor, supplyM2, supplyPy, privM2, privPy,
               price, acqtax, lratio, rate,
               loan, intA, intM, dep, rent,
               invL, invN, pmL, pmN, paL, paN, yL, yN });
}

/* ══════════════════════════════════════════
   상가매매견적서 렌더링
══════════════════════════════════════════ */
function renderSale(d) {
  const bL = Math.min(Math.max(d.yL, 0), 20) / 20 * 100;
  const bN = Math.min(Math.max(d.yN, 0), 20) / 20 * 100;

  const today = new Date();
  const todayStr = `${today.getFullYear()}. ${String(today.getMonth()+1).padStart(2,'0')}. ${String(today.getDate()).padStart(2,'0')}.`;

  const logoSvg = (goldStroke, navyStroke, size) => `
    <svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="29" stroke="${goldStroke}" stroke-width="1.6"/>
      <path d="M13 24 L32 11 L51 24" stroke="${goldStroke}" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 46 V25 M43 46 V25 M21 35.5 H43" stroke="${navyStroke}" stroke-width="4.2" stroke-linecap="round"/>
    </svg>`;

  const supplyTxt = d.supplyM2 > 0 ? d.supplyM2.toFixed(2) + ' m² / ' + d.supplyPy.toFixed(2) + ' 평' : (d.supplyPy > 0 ? (d.supplyPy * 3.30579).toFixed(2) + ' m² / ' + d.supplyPy.toFixed(2) + ' 평' : '-');
  const privTxt   = d.privM2 > 0 ? d.privM2.toFixed(2) + ' m² / ' + d.privPy.toFixed(2) + ' 평' : (d.privPy > 0 ? (d.privPy * 3.30579).toFixed(2) + ' m² / ' + d.privPy.toFixed(2) + ' 평' : '-');

  const html = `
  <div class="est-doc">
    <div class="est-banner">
      <div class="est-banner-top">
        <div class="est-brand">
          ${logoSvg('#e6cd8e', '#c9a24a', 30)}
          <div>
            <span class="kr">하이탑부동산</span>
            <span class="en">Haitop Realty</span>
          </div>
        </div>
        <div class="est-date">작성일자 <b>${todayStr}</b></div>
      </div>
      <h2>수 익 률 &nbsp; 상 가 &nbsp; 매 매 &nbsp; 견 적 서</h2>
      <div class="sub">C O M M E R C I A L &nbsp; R E A L &nbsp; E S T A T E &nbsp; Y I E L D &nbsp; E S T I M A T E</div>
    </div>

    <div class="info-card">
      <div class="info-cell"><div class="i-label">업&nbsp;&nbsp;종</div><div class="i-value">${d.biz}</div></div>
      <div class="info-cell"><div class="i-label">층&nbsp;&nbsp;수</div><div class="i-value">${d.floor > 0 ? d.floor + ' 층' : '-'}</div></div>
      <div class="info-cell"><div class="i-label">공급면적</div><div class="i-value">${supplyTxt}</div></div>
      <div class="info-cell"><div class="i-label">전용면적</div><div class="i-value">${privTxt}</div></div>
    </div>

    <table class="est-tbl">
      <colgroup>
        <col style="width:30%">
        <col style="width:35%">
        <col style="width:35%">
      </colgroup>
      <thead>
        <tr>
          <th>항목</th>
          <th>대출 (O)</th>
          <th>대출 (X)</th>
        </tr>
      </thead>
      <tbody>
        <tr class="sec"><td colspan="3">▪ &nbsp; 매 &nbsp; 매 &nbsp; 조 &nbsp; 건</td></tr>

        <tr class="emph-row">
          <td class="lbl">매매가격</td>
          <td class="c-both emph-num" colspan="2">${fmt(d.price)} 원</td>
        </tr>
        <tr>
          <td class="lbl">대출금액</td>
          <td class="c-cost">${fmt(d.loan)} 원</td>
          <td class="dash">-</td>
        </tr>
        <tr class="alt">
          <td class="lbl">대출비율</td>
          <td class="c-cost">${d.lratio} %</td>
          <td class="dash">-</td>
        </tr>
        <tr>
          <td class="lbl">이율</td>
          <td class="c-cost">${d.rate} %</td>
          <td class="dash">-</td>
        </tr>
        <tr class="alt">
          <td class="lbl">이자 (연)</td>
          <td class="c-cost">${fmt(d.intA)} 원</td>
          <td class="dash">-</td>
        </tr>
        <tr>
          <td class="lbl">월이자</td>
          <td class="c-cost">${fmt(d.intM)} 원</td>
          <td class="dash">-</td>
        </tr>

        <tr class="emph-row">
          <td class="lbl">보증금</td>
          <td class="c-both emph-num" colspan="2">${fmt(d.dep)} 원</td>
        </tr>
        <tr class="emph-row alt">
          <td class="lbl">월임대료</td>
          <td class="c-both emph-num" colspan="2">${fmt(d.rent)} 원</td>
        </tr>

        <tr class="sec"><td colspan="3">▪ &nbsp; 수 &nbsp; 익 &nbsp; 분 &nbsp; 석</td></tr>

        <tr class="inv">
          <td class="lbl">실투자금</td>
          <td class="c-loan">${fmt(d.invL)} 원</td>
          <td class="c-no">${fmt(d.invN)} 원</td>
        </tr>
        <tr class="inv">
          <td class="lbl">월수익금</td>
          <td class="c-loan${d.pmL < 0 ? ' neg' : ''}">${fmt(d.pmL)} 원</td>
          <td class="c-no${d.pmN < 0 ? ' neg' : ''}">${fmt(d.pmN)} 원</td>
        </tr>
        <tr class="inv">
          <td class="lbl">년수익금</td>
          <td class="c-loan${d.paL < 0 ? ' neg' : ''}">${fmt(d.paL)} 원</td>
          <td class="c-no${d.paN < 0 ? ' neg' : ''}">${fmt(d.paN)} 원</td>
        </tr>

        <tr class="yld">
          <td class="lbl">수 익 률</td>
          <td>
            <div class="yc">
              <div class="ytrack"><div class="yfill r1" style="width:${bL}%"></div></div>
              <span class="ynum loan-o">${fmtD(d.yL)}%</span>
            </div>
          </td>
          <td>
            <div class="yc">
              <div class="ytrack"><div class="yfill r2" style="width:${bN}%"></div></div>
              <span class="ynum loan-x">${fmtD(d.yN)}%</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="ref-note">
      ※ <strong>취득세 (4.6%)</strong> : ${fmt(d.acqtax)} 원 &nbsp;— 부가세 발생 여부 및 건물/토지 비율에 따라 변동될 수 있습니다.
    </div>

    <div class="est-foot">
      <div class="ef-left">
        ${logoSvg('#c9a24a', '#12244a', 26)}
        <div>
          <div class="fc">하이탑부동산공인중개사사무소</div>
          <div class="fp">
            대표: 주현희 &nbsp;|&nbsp; 경기도 파주시 책향기로 830, 1층<br>
            사업자등록번호 305-48-62183 &nbsp;|&nbsp; 중개사무소 등록번호 41480-2016-00026<br>
            newpajucity@naver.com
          </div>
        </div>
      </div>
      <div class="ef-right">
        <div class="ef-tel"><span>TEL</span>031-949-8969</div>
        <div class="ef-fax">FAX 031-944-1108</div>
      </div>
    </div>
    <div class="est-base"></div>
  </div>`;

  $('ph-sale').style.display = 'none';
  const r = $('res-sale');
  r.innerHTML = html;
  r.style.display = 'block';
}

</script>

</body>
</html>
